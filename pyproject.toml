[project]
name = "tdt13-toxicity"
version = "0.1.0"
description = "TDT13: toxicity detection in code review comments (ToxiCR)"
requires-python = ">=3.12"
dependencies = [
    "detoxify>=0.5.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.20.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Lets tests do `import config` the same way scripts in src/ do.
pythonpath = ["src"]
testpaths = ["tests"]
